# Regenerates the live images the README pulls from the `output` branch:
#   stats.svg                       — GitHub stats card (scripts/build_stats.py)
#   snake-dark.svg / snake-light.svg — contribution-graph snake
# If any step fails nothing is pushed, so the last good images stay up.
name: Profile assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build stats card
        run: python3 scripts/build_stats.py --user "${{ github.repository_owner }}" --out dist/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#FBBC05&color_dots=#161B22,#0C2D6B,#1A56C4,#3B7BEF,#8AB4F8
            dist/snake-light.svg?color_snake=#EA4335&color_dots=#EBEDF0,#C6DAFC,#8AB4F8,#4285F4,#1A56C4

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
